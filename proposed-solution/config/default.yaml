# Full run on the Reddit Mental Health Dataset (Low et al., 2020; Zenodo 3941387, PDDL 1.0).
# Download the raw files first:  python -m src.main download --config config/default.yaml
run_name: default
seed: 42

# Ordered set D of conditions. Each condition is linked to one Reddit community.
conditions: [adhd, anxiety, depression]

data:
  source: low2020                     # one CSV per community, Low et al. schema (subreddit, author, date, post)
  raw_dir: data/raw
  preprocessed_dir: data/preprocessed
  zenodo_url: https://zenodo.org/records/3941387/files/{file}?download=1
  files:
    adhd: adhd_2019_features_tfidf_256.csv
    anxiety: anxiety_2019_features_tfidf_256.csv
    depression: depression_2019_features_tfidf_256.csv
  community_to_condition: {adhd: adhd, anxiety: anxiety, depression: depression}
  max_posts_per_community: 5000       # balanced subsample after cleaning
  min_tokens: 20
  max_tokens: 400
  one_post_per_author: true           # avoids author leakage across splits
  split: {train: 0.70, val: 0.15, test: 0.15}

features:                             # phi(s): TF-IDF over word uni- and bigrams
  ngram_range: [1, 2]
  min_df: 3
  max_features: 50000
  sublinear_tf: true

model:                                # order-averaged classifier chain
  C: 1.0
  class_weight: balanced
  max_iter: 2000
  augment: oof                        # predecessor inputs at training time: oof (cross-fitted) | true (gold labels)
  oof_folds: 5

decision:
  threshold_grid: {start: 0.05, stop: 0.95, step: 0.05}

rationale:
  delta: 0.01                         # minimum probability drop for a phrase to count as evidence
  max_fraction: 0.5                   # at most ceil(0.5 * n) phrases per condition
  min_phrases: 1

output_dir: output/default
eval_dir: evaluation/results/default
ground_truth_dir: evaluation/ground_truth/default

demo_text: "I can't focus on anything, I feel restless and I've been more irritable than usual."
