# Quickstart: real public Reddit posts bundled with the repository (data/raw/reddit_public_sample.csv),
# so no download is needed. Runs in about a minute on a laptop.
# Sources and licences: see "Data" in README.md; rebuild with scripts/build_public_sample.py.
run_name: quickstart
seed: 42

conditions: [adhd, anxiety, depression]

data:
  source: csv
  csv_path: data/raw/reddit_public_sample.csv
  preprocessed_dir: data/preprocessed
  community_to_condition: {adhd: adhd, anxiety: anxiety, depression: depression}
  max_posts_per_community: 350        # balanced: the smallest community has about 360 usable posts
  min_tokens: 20
  max_tokens: 600
  one_post_per_author: true           # no author field in this sample, so this has no effect here
  split: {train: 0.70, val: 0.15, test: 0.15}

features:
  ngram_range: [1, 2]
  min_df: 2
  max_features: 30000
  sublinear_tf: true

model:
  C: 1.0
  class_weight: balanced
  max_iter: 2000
  augment: oof
  oof_folds: 5

decision:
  threshold_grid: {start: 0.05, stop: 0.95, step: 0.05}

rationale:
  delta: 0.01
  max_fraction: 0.5
  min_phrases: 1

output_dir: output/quickstart
eval_dir: evaluation/results/quickstart
ground_truth_dir: evaluation/ground_truth/quickstart

demo_text: "I can't focus on anything, I feel restless and I've been more irritable than usual."
